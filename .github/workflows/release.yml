name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package addon
        run: |
          mkdir -p package
          git archive \
            --format=zip \
            --output=package/inari.zip \
            HEAD \
            inari

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: package/inari.zip
          generate_release_notes: true
